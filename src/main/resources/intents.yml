version: "3.1"
nlu:
  - intent: faq_shipping
    metadata:
      domain: faq
      actionType: FAQ
      replyTemplate: "我们的订单由顺丰配送，通常 1-3 天送达。"
      slots:
        - name: shippingTopic
          keywords:
            - 物流
            - 配送
          prompt: ""
    examples: |
      - 想了解物流
      - 快递什么时候到
      - 发货了吗
      - 配送方式是？
  - intent: order_status
    metadata:
      domain: order
      actionType: ORDER_STATUS
      replyTemplate: "${orderStatus}。如需人工帮助请留言。"
      slots:
        - name: orderId
          required: true
          prompt: "请提供您的订单号，我来帮您查询。"
          pattern: "(?i)(?:订单|单号)[:：\\s]*([A-Za-z0-9-]+)"
    examples: |
      - 订单进度
      - 查询订单
      - 我想知道订单状态
      - 查一下进度
      - 订单号 A001
      - 单号 12345
  - intent: handoff
    metadata:
      domain: service
      actionType: HUMAN_HANDOFF
      replyTemplate: "稍等，我帮您转接人工客服。"
    examples: |
      - 转人工
      - 我要人工客服
      - 联系客服电话
      - 电话客服
  - intent: book_train
    metadata:
      domain: travel
      actionType: SKILL
      skillName: train_ticket_12306
      replyTemplate: "正在为您连接 12306。"
      slots:
        - name: destination
          required: true
          prompt: "请告诉我您要前往的城市，例如“去北京”。"
          pattern: "(?:去|到)([\\u4e00-\\u9fa5]+)"
        - name: departureCity
          required: true
          prompt: "请告诉我出发城市，例如“从上海出发”。"
          pattern: "从([\\u4e00-\\u9fa5]+)出发"
        - name: departureDate
          required: true
          prompt: "请告知出发日期（如明天/8月8日）。"
          pattern: "(?:在)?((?:今|明|后)天|[0-9]{1,2}月[0-9]{1,2}日)"
    examples: |
      - 我要去北京
      - 想坐火车去上海
      - 去广州的火车
      - 从上海出发
      - 明天的票
