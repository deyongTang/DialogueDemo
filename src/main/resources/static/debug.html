<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dialogue Demo 调试台</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
        }

        body {
            margin: 0;
            background: #f5f6fa;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        form,
        .panel {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
            padding: 20px;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5f5;
            font-size: 14px;
            resize: vertical;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: 2px solid #6b76ff;
            border-color: transparent;
        }

        textarea {
            min-height: 120px;
        }

        .form-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .form-control {
            flex: 1;
        }

        button {
            cursor: pointer;
            border: none;
            background: linear-gradient(120deg, #6b76ff, #5b9dff);
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            transition: transform .1s ease, box-shadow .2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(91, 157, 255, .3);
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #94a3b8;
            color: #334155;
            margin-left: 10px;
        }

        .output {
            display: grid;
            gap: 16px;
        }

        .history {
            max-height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            padding: 12px;
            border-radius: 10px;
            background: #f1f5f9;
        }

        .history-item .meta {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 6px;
        }

        .output-card {
            padding: 16px;
            border-radius: 10px;
            background: #f8fafc;
        }

        .output-card pre {
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 12px;
            border-radius: 999px;
            background: #eef2ff;
            color: #312e81;
            font-weight: 600;
            font-size: 13px;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #0f172a;
                color: #e2e8f0;
            }

            form,
            .panel {
                background: #162044;
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            }

            input[type="text"],
            textarea {
                background: #0f172a;
                border-color: #334155;
                color: #e2e8f0;
            }

            .output-card {
                background: #0f172a;
            }

            .btn-secondary {
                color: #e2e8f0;
                border-color: #334155;
            }

            .history-item {
                background: #1f2a4c;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Dialogue Demo 调试台</h1>
    <form id="dialogue-form">
        <div class="form-control" style="margin-bottom: 14px;">
            <label for="endpoint">接口地址</label>
            <input type="text" id="endpoint" value="http://localhost:8080/api/dialogue/message"
                   autocomplete="url" spellcheck="false">
        </div>

        <div class="form-row">
            <div class="form-control">
                <label for="sessionId">Session ID</label>
                <input type="text" id="sessionId" value="debug-user" autocomplete="off" spellcheck="false">
            </div>
            <div class="form-control" style="min-width: 220px;">
                <label>&nbsp;</label>
                <button type="button" class="btn-secondary" id="new-session">随机 Session</button>
            </div>
        </div>

        <div class="form-control" style="margin-top: 18px;">
            <label for="message">用户输入</label>
            <textarea id="message" placeholder="例如：想了解物流、我想查下订单状态..."></textarea>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" id="send-btn">发送请求</button>
        </div>
    </form>

    <section class="panel">
        <h2 style="margin-top: 0;">响应</h2>
        <div class="output">
            <div class="output-card">
                <div class="badge" id="intent-badge">domain -- · intent --</div>
                <p id="reply-text" style="font-size: 18px; line-height: 1.6; margin: 14px 0 0;"></p>
            </div>
            <div class="output-card">
                <strong>原始响应</strong>
                <pre id="raw-response">尚未发送请求</pre>
            </div>
        </div>
    </section>

    <section class="panel">
        <h2 style="margin-top: 0;">请求日志</h2>
        <div id="log" style="font-size: 13px; white-space: pre-wrap; word-break: break-word;"></div>
    </section>

    <section class="panel">
        <h2 style="margin-top: 0;">对话历史</h2>
        <div id="history" class="history"></div>
    </section>
</div>

<script>
    const form = document.getElementById('dialogue-form');
    const endpointInput = document.getElementById('endpoint');
    const sessionInput = document.getElementById('sessionId');
    const messageInput = document.getElementById('message');
    const sendBtn = document.getElementById('send-btn');
    const replyText = document.getElementById('reply-text');
    const intentBadge = document.getElementById('intent-badge');
    const logContainer = document.getElementById('log');
    const rawResponse = document.getElementById('raw-response');
    const randomBtn = document.getElementById('new-session');
    const historyContainer = document.getElementById('history');

    const appendLog = (title, payload) => {
        const timestamp = new Date().toLocaleTimeString();
        const next = `[${timestamp}] ${title}\n${JSON.stringify(payload, null, 2)}\n\n`;
        logContainer.textContent = next + logContainer.textContent;
    };

    const addHistoryItem = (request, response) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'history-item';
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `${new Date().toLocaleTimeString()} · session ${request.sessionId}`;
        const user = document.createElement('div');
        user.innerHTML = `<strong>用户:</strong> ${request.message}`;
        const bot = document.createElement('div');
        bot.innerHTML = `<strong>系统:</strong> ${response.reply ?? ''} <span style="font-size:12px;color:#94a3b8;">(domain: ${response.domain ?? '--'}, intent: ${response.intentId ?? '--'})</span>`;
        wrapper.append(meta, user, bot);
        historyContainer.appendChild(wrapper);
        historyContainer.scrollTop = historyContainer.scrollHeight;
    };

    const setBusy = (busy) => {
        sendBtn.disabled = busy;
        sendBtn.textContent = busy ? '发送中...' : '发送请求';
    };

    randomBtn.addEventListener('click', () => {
        const randomId = `debug-${Math.floor(Math.random() * 1e6)}`;
        sessionInput.value = randomId;
    });

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!messageInput.value.trim()) {
            messageInput.focus();
            return;
        }

        const payload = {
            sessionId: sessionInput.value.trim() || 'debug-user',
            message: messageInput.value.trim()
        };
        const endpoint = endpointInput.value.trim();

        appendLog('Request', {endpoint, ...payload});
        setBusy(true);

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            const domainText = data.domain ?? '--';
            const intentText = data.intentId ?? '--';
            intentBadge.textContent = `domain ${domainText} · intent ${intentText}`;
            replyText.textContent = data.reply ?? '';
            rawResponse.textContent = JSON.stringify(data, null, 2);
            appendLog('Response', data);
            addHistoryItem(payload, data);
        } catch (error) {
            intentBadge.textContent = 'domain -- · intent --';
            replyText.textContent = '请求失败，请检查服务是否已启动或接口地址是否正确。';
            rawResponse.textContent = String(error);
            appendLog('Error', {message: error.message});
        } finally {
            setBusy(false);
        }
    });
</script>
</body>
</html>
